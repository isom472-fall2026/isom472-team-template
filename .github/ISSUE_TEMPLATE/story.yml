name: User story
description: One thing a user can do with the system.
title: "[S-__] "
labels: ["story"]
body:
  - type: markdown
    attributes:
      value: |
        One story is one thing a user can do. If you need the word "and" twice, it is two stories.
  - type: textarea
    id: story
    attributes:
      label: The story
      description: Three lines. Keep the shape.
      value: |
        As a
        I want
        So that
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: How anyone can tell it is done. Each one must be checkable by a teammate doing it. "Works well" is not a criterion.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Who is building this
      description: One name. Assign the issue to them as well.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - "Phase 2 — design sprint"
        - "Phase 3 — sprint 1"
        - "Phase 4 — sprint 2"
        - "Phase 5 — sprint 3"
        - "Phase 6 — final sprint"
    validations:
      required: true
  - type: input
    id: contract
    attributes:
      label: Boundary it crosses (optional)
      description: If this story hands something to another member's work, name the contract file in docs/contracts/.
